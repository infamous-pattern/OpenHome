name: Feature request
description: Suggest an improvement or new capability for OpenHomeB
title: "[Feature]: "
labels:
  - enhancement
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement to OpenHomeB. Please describe the user
        problem first, then explain the proposed solution.

  - type: dropdown
    id: area
    attributes:
      label: Related area
      options:
        - Homebridge Devices
        - Switch
        - Set State
        - Adjust State
        - Brightness
        - Open Homebridge UI
        - Authentication or connection
        - Device compatibility
        - User interface
        - Installation or packaging
        - Documentation
        - New action
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish, and what is difficult today?
      placeholder: Describe the workflow, device, and desired outcome.
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed solution
      description: Describe how you think OpenHomeB should address the use case.
      placeholder: Include expected button, encoder, property-inspector, and state behaviour where relevant.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternative approaches you have tried.
    validations:
      required: false

  - type: input
    id: device
    attributes:
      label: Relevant device or Homebridge plugin
      placeholder: "Example: thermostat exposed by homebridge-example"
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add screenshots, examples, API details, or links that may help.
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues for the same request.
          required: true
        - label: This request describes a specific OpenHomeB use case.
          required: true
