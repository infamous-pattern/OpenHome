name: Bug report
description: Report a reproducible problem with the OpenHome plugin
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the plugin. Remove passwords, tokens, and private hostnames from logs before attaching them.
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: 2.0.0
    validations:
      required: true
  - type: input
    id: opendeck
    attributes:
      label: OpenDeck version
    validations:
      required: true
  - type: input
    id: homebridge
    attributes:
      label: Homebridge and Config UI versions
      placeholder: Homebridge 2.2.1, Config UI x.x.x
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Linux architecture
      options:
        - x86_64
        - aarch64
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Describe the action, selected service/characteristic, and what happened.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant plugin log lines
      description: Remove credentials, tokens, public hostnames, and IP addresses you do not want shared.
      render: text
